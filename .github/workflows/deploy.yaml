name: Deploy MultiDocker
on:
  push:
    branches:
        - main # Default branch might be master!
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        # # Σύνδεση στο Docker Hub
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p {{secrets.DOCKER_PASSWORD }}

        # Build του image για τα tests
      - run: docker build -t stelios/react-test -f ./client/Dockerfile.dev .

        # Εκτέλεση των tests      
      - run: docker run -e CI=true stelios/react-test npm test 

      
